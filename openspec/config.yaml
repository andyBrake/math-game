schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Paths: this project (math-game) is the code repository root, and it lives
  inside the WorkBuddy workspace whose root is the project root. Every path in
  documentation, tasks, code, comments and config MUST be relative to the
  repository root (for example `data/curriculum.js`, `js/store.js`,
  `assets/characters/`). Never write machine-specific absolute paths (a path
  starting from the filesystem root or a home directory).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
